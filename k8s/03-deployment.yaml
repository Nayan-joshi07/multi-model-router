apiVersion: apps/v1
kind: Deployment
metadata:
  name: router
  namespace: llm-router
  labels: {app: router}
spec:
  replicas: 2
  selector:
    matchLabels: {app: router}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}   # zero-downtime deploys
  template:
    metadata:
      labels: {app: router}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: router
          image: multi-model-router:local      # for kind/minikube; use your registry image in cloud
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000, name: http}]
          envFrom:
            - configMapRef: {name: router-config}
            - secretRef: {name: router-secrets, optional: true}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
