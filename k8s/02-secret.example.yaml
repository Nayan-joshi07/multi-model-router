# Copy to 02-secret.yaml, fill in, and NEVER commit it.
# Or create it imperatively:
#   kubectl -n llm-router create secret generic router-secrets \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-... --from-literal=OPENAI_API_KEY=sk-...
apiVersion: v1
kind: Secret
metadata:
  name: router-secrets
  namespace: llm-router
type: Opaque
stringData:
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  GEMINI_API_KEY: ""
